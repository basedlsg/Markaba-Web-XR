<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markaba Web XR - Wave-Based Bubble Interactions</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      width: 100%;
      height: 100vh;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    #renderCanvas {
      width: 100%;
      height: 100%;
      touch-action: none;
      outline: none;
    }

    #loadingScreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      z-index: 1000;
      transition: opacity 0.5s ease-out;
    }

    #loadingScreen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader {
      width: 50px;
      height: 50px;
      border: 5px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    h1 {
      margin-top: 20px;
      font-size: 24px;
      font-weight: 300;
    }

    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 100;
      max-width: 300px;
    }

    #info h2 {
      margin: 0 0 10px 0;
      font-size: 16px;
      font-weight: 600;
    }

    #info p {
      margin: 5px 0;
      line-height: 1.4;
    }

    #enterVR {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      padding: 15px 30px;
      background: rgba(102, 126, 234, 0.9);
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      z-index: 100;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    #enterVR:hover {
      background: rgba(102, 126, 234, 1);
      transform: translateX(-50%) scale(1.05);
    }

    #enterVR:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div id="loadingScreen">
    <div class="loader"></div>
    <h1>Loading Markaba Web XR...</h1>
  </div>

  <div id="info">
    <h2>Markaba Web XR</h2>
    <p><strong>Desktop:</strong> Click and drag to rotate camera</p>
    <p><strong>VR:</strong> Click "Enter VR" below</p>
    <p><strong>Quest 3:</strong> Use hand tracking to interact with bubbles</p>
  </div>

  <canvas id="renderCanvas"></canvas>

  <button id="enterVR" style="display: none;">Enter VR</button>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
